# The real discovery found one AMS 2 Pro and two external spool endpoints.
[[ams]]
id = "ams_1"
model = "AMS 2 Pro"
tray_entities = [
  "sensor.replace_with_discovered_x2d_slug_ams_1_tray_1",
  "sensor.replace_with_discovered_x2d_slug_ams_1_tray_2",
  "sensor.replace_with_discovered_x2d_slug_ams_1_tray_3",
  "sensor.replace_with_discovered_x2d_slug_ams_1_tray_4",
]
[ams.entities]
active = "binary_sensor.replace_with_discovered_x2d_slug_ams_1_active"
humidity_percent = "sensor.replace_with_discovered_x2d_slug_ams_1_humidity"
humidity_index = "sensor.replace_with_discovered_x2d_slug_ams_1_humidity_index"
temperature = "sensor.replace_with_discovered_x2d_slug_ams_1_temperature"
drying = "binary_sensor.replace_with_discovered_x2d_slug_ams_1_drying"
remaining_drying_time = "sensor.replace_with_discovered_x2d_slug_ams_1_remaining_drying_time"

[[ams]]
id = "external_spool_1"
model = "External Spool"
tray_entities = ["sensor.replace_with_discovered_x2d_slug_externalspool_external_spool"]
[ams.entities]
active = "binary_sensor.replace_with_discovered_x2d_slug_externalspool_active"

[[ams]]
id = "external_spool_2"
model = "External Spool"
tray_entities = ["sensor.replace_with_discovered_x2d_slug_externalspool2_external_spool"]
[ams.entities]
active = "binary_sensor.replace_with_discovered_x2d_slug_externalspool2_active"

