# Non-secret allow-list for the read-only X2D observer. Do not guess these IDs.
# Populate them only after running the documented Home Assistant discovery step.

[printer]
id = "x2d"
model = "X2D"
firmware_version = "01.02.00.00" # observed in HA device registry; verify after updates

[home_assistant]
url = "http://127.0.0.1:8123"
poll_seconds = 15
timeout_seconds = 3
max_response_bytes = 4194304
stale_after_seconds = 90

[storage]
database_path = "/var/lib/home-sensor/printer.sqlite3"
permanent_sample_seconds = 300
terminal_confirmations = 2

[analysis]
environment_location = "office" # actual SEN66 location observed on this Pi
baseline_minutes = 30
recovery_minutes = 120

[automatic_monitoring]
enabled = true
database_path = "/var/lib/home-sensor/monitoring.sqlite3"
output_dir = "/var/lib/home-sensor/exports"

[cloud_history]
enabled = true
refresh_seconds = 3600
timeout_seconds = 15
max_records = 1000

[maintenance_engine]
# Seed the Bambu Lab X2D published maintenance catalog (wiki periodic
# maintenance page). Set to false to run with locally configured tasks only.
manufacturer_tasks_enabled = true
# How often the observer re-evaluates maintenance state and appends durable
# transition events. Events are edge-triggered, so this does not resend.
evaluation_seconds = 300
# Local policy, not a Bambu Lab value: the averaging window used to place the
# printer in Bambu Lab's usage tiers (>= 5 h/day, 1-5 h/day, < 1 h/day).
rolling_window_days = 30
minimum_history_days = 7

# Required mappings. The remaining mappings are optional and omitted when HA
# does not expose them. These syntactically valid IDs are deliberately non-real.
[entities]
online = "binary_sensor.replace_with_discovered_x2d_slug_online"
print_status = "sensor.replace_with_discovered_x2d_slug_print_status"
current_stage = "sensor.replace_with_discovered_x2d_slug_current_stage"
job_name = "sensor.replace_with_discovered_x2d_slug_task_name"
progress_percent = "sensor.replace_with_discovered_x2d_slug_print_progress"
remaining_time = "sensor.replace_with_discovered_x2d_slug_remaining_time"
current_layer = "sensor.replace_with_discovered_x2d_slug_current_layer"
total_layers = "sensor.replace_with_discovered_x2d_slug_total_layer_count"
print_started_at = "sensor.replace_with_discovered_x2d_slug_start_time"
expected_finished_at = "sensor.replace_with_discovered_x2d_slug_end_time"
nozzle_1_temperature = "sensor.replace_with_discovered_x2d_slug_left_nozzle_temperature"
nozzle_1_target = "sensor.replace_with_discovered_x2d_slug_left_nozzle_target_temperature"
nozzle_2_temperature = "sensor.replace_with_discovered_x2d_slug_right_nozzle_temperature"
nozzle_2_target = "sensor.replace_with_discovered_x2d_slug_right_nozzle_target_temperature"
bed_temperature = "sensor.replace_with_discovered_x2d_slug_bed_temperature"
bed_target = "sensor.replace_with_discovered_x2d_slug_bed_target_temperature"
chamber_temperature = "sensor.replace_with_discovered_x2d_slug_chamber_temperature"
chamber_target = "sensor.replace_with_discovered_x2d_slug_chamber_target_temperature"
active_tool = "sensor.replace_with_discovered_x2d_slug_tool_module"
ams_slot = "sensor.replace_with_discovered_x2d_slug_active_tray"
print_source = "sensor.replace_with_discovered_x2d_slug_print_type"
gcode_filename = "sensor.replace_with_discovered_x2d_slug_gcode_filename"
print_bed_type = "sensor.replace_with_discovered_x2d_slug_print_bed_type"
print_weight_grams = "sensor.replace_with_discovered_x2d_slug_print_weight"
print_length_meters = "sensor.replace_with_discovered_x2d_slug_print_length"
nozzle_1_type = "sensor.replace_with_discovered_x2d_slug_left_nozzle_type"
nozzle_1_size_mm = "sensor.replace_with_discovered_x2d_slug_left_nozzle_size"
nozzle_2_type = "sensor.replace_with_discovered_x2d_slug_right_nozzle_type"
nozzle_2_size_mm = "sensor.replace_with_discovered_x2d_slug_right_nozzle_size"
cooling_fan_percent = "sensor.replace_with_discovered_x2d_slug_cooling_fan_speed"
auxiliary_fan_percent = "sensor.replace_with_discovered_x2d_slug_aux_fan_speed"
chamber_fan_percent = "sensor.replace_with_discovered_x2d_slug_chamber_fan_speed"
heatbreak_fan_percent = "sensor.replace_with_discovered_x2d_slug_heatbreak_fan_speed"
wifi_signal_dbm = "sensor.replace_with_discovered_x2d_slug_wi_fi_signal"
