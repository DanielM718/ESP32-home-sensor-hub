[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "butters-nas-agent"
version = "0.1.0"
description = "Outbound-only, schema-locked NAS agent for Butters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["websockets==15.0.1", "cryptography==50.0.0"]

[project.scripts]
butters-nas-agent = "butters_nas_agent.__main__:main"
butters-nas-agent-provision = "butters_nas_agent.provision:main"

[tool.setuptools.packages.find]
where = ["src"]
