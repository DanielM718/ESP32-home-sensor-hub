schema_version = 1

[agent]
url = "wss://sensor-pi.tail9644cc.ts.net:8443/nas-agent/v1/session"
agent_id = "nas-primary"
spki_sha256 = "REPLACE_WITH_64_LOWERCASE_HEX_CHARACTERS_BEFORE_STAGING"
heartbeat_seconds = 15
health_file = "/run/butters-nas-agent/last-heartbeat"

[truenas]
# The fixed local endpoint and the reviewed middleware certificate SPKI are
# operator-owned. The API key is not sent until the SPKI comparison succeeds.
url = "wss://192.168.1.240/api/current"
username = "butters_nas_status"
spki_sha256 = "REPLACE_WITH_TRUENAS_64_LOWERCASE_HEX_CHARACTERS"
timeout_seconds = 5
# Dormant by construction. When enabling, add a distinct fixed
# `shutdown_username = "butters_nas_power"` and mount its separate FULL_ADMIN
# key file. The read key is never authenticated as the shutdown identity.
shutdown_enabled = false

[jellyfin]
url = "http://192.168.1.240:8096"
health_path = "/health"
# Requires a separately reviewed NAS-local Jellyfin API token supplied with
# --jellyfin-api-key. The agent uses it only for one fixed GET, but Jellyfin
# does not make the token itself a narrowly scoped monitoring credential.
# Keep false until that credential is explicitly staged.
session_monitoring_enabled = false
local_networks = ["192.168.1.0/24"]
remote_networks = ["100.64.0.0/10", "fd7a:115c:a1e0::/48"]

[network]
enabled = false
# Operator-owned; callers can never select an interface.
physical_interface = "REPLACE_WITH_REVIEWED_PHYSICAL_INTERFACE"
# The only accepted metrics URL is Tailscale's documented local-only endpoint.
tailscale_metrics_url = "http://100.100.100.100/metrics"
sample_interval_seconds = 5
smoothing_alpha = 0.35
maximum_sample_interval_seconds = 30

[bandwidth]
effective_capacity_mbps = 30
safe_streaming_budget_mbps = 24
reserve_mbps = 6
minimum_stream_mbps = 3
maximum_stream_mbps = 24
stream_stability_seconds = 15
minimum_change_mbps = 1
policy_cooldown_seconds = 30
# This build rejects "enforce" at startup.
policy_mode = "dry_run"
