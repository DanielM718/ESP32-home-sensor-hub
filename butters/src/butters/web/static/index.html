<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101713">
  <title>Butters</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="chat-body">
  <main class="chat-shell" aria-label="Butters conversation">
    <header class="chat-header">
      <div class="identity-mark" aria-hidden="true"><span>B</span></div>
      <div>
        <h1>Butters</h1>
        <p id="assistant-state" class="assistant-state" data-state="connecting">Connecting</p>
      </div>
      <button id="clear-button" class="quiet-button" type="button" aria-label="Clear conversation">Clear</button>
    </header>

    <section id="conversation" class="conversation" aria-live="polite" aria-label="Conversation">
      <article class="message assistant-message">
        <p>Hi. Ask me about the sensors or the home-sensor stack.</p>
      </article>
    </section>

    <div id="partial" class="partial" hidden></div>
    <form id="chat-form" class="composer">
      <label class="visually-hidden" for="message-input">Message Butters</label>
      <input id="message-input" name="message" maxlength="4000" autocomplete="off" placeholder="Ask Butters…" required>
      <button id="mic-button" class="mic-button" type="button" aria-label="Hold to speak" title="Hold to speak">
        <span aria-hidden="true"></span>
      </button>
      <button id="send-button" class="send-button" type="submit">Send</button>
    </form>
    <button id="stop-audio" class="stop-audio" type="button" hidden>Stop speaking</button>
  </main>
  <script src="/assets/app.js" defer></script>
</body>
</html>
