# Install as root:root 0644 at /etc/tmpfiles.d/butters-action-broker.conf.
#
# systemd creates the parent directory of a ListenStream= path itself, as
# root:root with DirectoryMode=; SocketUser=/SocketGroup= only chown the socket
# node. RuntimeDirectory= is not an option here either: a .socket unit creates
# exec directories only when it spawns a process, and the parent has to exist
# before the socket is bound, which happens before the service is activated. So
# the directory's ownership is declared here instead.
#
# 0710 grants the butters service group traversal only: no listing, no world
# access, and never group- or world-writable. The socket node inside stays
# butters:butters 0600, so only the butters uid can connect, and SO_PEERCRED
# rechecks that uid in process.
d /run/butters-action-broker 0710 root butters -
