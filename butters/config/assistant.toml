# Non-secret deterministic assistant configuration. Source IDs mirror the
# deployed dashboard API; friendly names are explicit rather than inferred.

[integration]
dashboard_url = "http://127.0.0.1:8080"
timeout_seconds = 4.0
cache_seconds = 5.0
max_response_bytes = 2097152

# One fixed Windows desktop. Values here never become model arguments. The
# broker operations preserve the fixed behavior inventoried from the existing
# scripts without granting the web service access to mutable user files.
[desktop]
enabled = true
machine = "desktop"
host = "DESKTOP-G4CFVL1.local"
ssh_port = 22
network_timeout_seconds = 45.0
ssh_timeout_seconds = 90.0
total_timeout_seconds = 150.0
poll_interval_seconds = 2.0
wake_enabled = true
# Wake-only policy: wake_desktop needs nothing but a fixed Wake-on-LAN packet.
# Headless/local mode controls only the two fixed Home Assistant monitor
# switches. The root broker retains a separate, default-off gate for each.
headless_enabled = true
monitors_enabled = true
# Fixed Parsec support: status and idempotent ensure are validated against the
# real desktop and are the state production has been running, so they stay
# enabled here. Shipping main's defaults over them would silently disable
# working Parsec control on the first deployment of this branch.
parsec_status_enabled = true
parsec_ensure_enabled = true
parsec_restart_enabled = false
lock_enabled = false
sleep_enabled = false
restart_enabled = false
# Shutdown is exposed in Admin -> Tools and is the state production runs. It
# stays behind FRESH passkey authentication bound to a frozen plan plus explicit
# confirmation, so enabling the capability is not a one-click action.
# host_shutdown_enabled, which powers off Butters itself, stays off.
shutdown_enabled = true

# Passkey trust values are server-known constants, never derived from proxy
# headers. Authentication is a step-up inside the private tailnet boundary.
[authentication]
enabled = true
rp_id = "sensor-pi.tail9644cc.ts.net"
origin = "https://sensor-pi.tail9644cc.ts.net"
rp_name = "Butters"
elevation_seconds = 600.0
challenge_seconds = 120.0
pending_action_seconds = 300.0
local_console_seconds = 45.0
bootstrap_seconds = 600.0
max_credentials = 16
max_challenges = 64

# Installed as a separately reviewed, privileged service. The web daemon speaks
# only the enumerated v1 protocol over this fixed Unix socket. Enabling this flag
# does not grant any operation: each one has a second gate in the root broker's
# /etc/butters/action-broker.toml, which is the terminal boundary.
[broker]
enabled = true
socket_path = "/run/butters-action-broker/broker.sock"
protocol_version = 1
connect_timeout_seconds = 2.0
request_timeout_seconds = 30.0
max_message_bytes = 8192

# Observer-only Desktop Agent ingress. This application gate must be enabled in
# addition to installing/enabling the separate private TLS ingress service.
# Machine credentials live in the root-managed file, never in this config.
#
# The repository template ships this gate OFF and reviewed tests assert that.
# Enabling it is a deliberate post-install step on the deployed, root-owned
# copy at /opt/butters/config/assistant.toml -- see
# DEPLOY_NAS_PORTAL_RUNBOOK.md -- so a checkout can never carry a live machine
# ingress into a new deployment by accident.
[agent_ingress]
enabled = false
config_path = "/etc/butters/desktop-agent.toml"
protocol_version = 1
hello_timeout_seconds = 5
socket_idle_seconds = 60
heartbeat_aging_seconds = 30
heartbeat_stale_seconds = 45
request_timeout_seconds = 30

# Separate NAS machine ingress. This repository and production deployment ship
# it disabled; staging requires independent nas-primary credentials.
[nas_agent_ingress]
enabled = false
config_path = "/etc/butters/nas-agent.toml"
protocol_version = 1
hello_timeout_seconds = 5
socket_idle_seconds = 60
heartbeat_aging_seconds = 30
heartbeat_stale_seconds = 45
request_timeout_seconds = 30
max_pending_requests = 1

[actions]
audit_capacity = 1000
job_capacity = 256
host_restart_butters_enabled = false
host_reboot_enabled = false
host_shutdown_enabled = false

[actions.nas]
enabled = true
configured = true
maximum_duration_minutes = 1
local_console_allowed = false
require_fresh_sensor = false
safety_entity = ""
safety_max_age_seconds = 120.0

# Powering the NAS off is gated separately from waking it, so enabling wake can
# never imply shutdown. This server gate and the NAS Agent's local gate both
# ship false; a later staging approval must enable them independently.
[actions.nas_shutdown]
enabled = false
configured = false
maximum_duration_minutes = 1
local_console_allowed = false
require_fresh_sensor = false
safety_entity = ""
safety_max_age_seconds = 120.0

[actions.heater]
enabled = false
configured = false
maximum_duration_minutes = 120
local_console_allowed = false
require_fresh_sensor = true
safety_entity = ""
safety_max_age_seconds = 120.0

[actions.dehumidifier]
enabled = false
configured = false
maximum_duration_minutes = 240
local_console_allowed = false
require_fresh_sensor = false
safety_entity = ""
safety_max_age_seconds = 120.0

[actions.ventilation]
enabled = false
configured = false
maximum_duration_minutes = 240
local_console_allowed = false
require_fresh_sensor = false
safety_entity = ""
safety_max_age_seconds = 120.0

[tts]
model_dir = "../models/vits-piper-en_US-kathleen-low"
num_threads = 2
speed = 1.0
max_text_chars = 500

# Provider-independent conversational planning is fail-closed until a reviewed
# provider is configured. The first foundation deliberately ships without any
# cloud credentials or model integration.
[planner]
enabled = false
provider = "disabled"
max_actions = 3
max_context_messages = 4
max_context_chars = 2000

# The beta web daemon is deliberately loopback-only. Production HTTPS and
# identity forwarding are supplied by private Tailscale Serve, never Funnel.
[web]
host = "127.0.0.1"
port = 8090
state_dir = "/var/lib/butters"
trusted_tailscale_proxy = true
development_mode = false
# Populate with exact Tailscale-User-Login values before using admin APIs.
admin_identities = []
# Production requires the exact private HTTPS origin. It is normally supplied by
# BUTTERS_ALLOWED_ORIGINS in /etc/butters/butters.conf because the Tailscale
# Serve URL is only known after deployment. While it is unset, /readyz reports
# not_ready and the daemon refuses to issue sessions or accept mutations.
allowed_origins = []
max_active_sessions = 32
# Anonymous callers can never take the last slots: a session flood cannot lock
# an administrator out of the privileged surface.
admin_session_reserve = 4
max_sessions_per_peer = 4
session_create_rate_per_minute = 12.0
session_create_burst = 6
session_ttl_seconds = 1800.0
max_messages_per_session = 24
max_context_chars = 12000
max_request_bytes = 16384
max_workers = 4
max_queued_requests = 12
trace_capacity = 256
# Traces quote conversation text, so they expire by time as well as by count.
trace_ttl_seconds = 900.0
clarification_timeout_seconds = 30.0

[browser_audio]
max_utterance_seconds = 30.0
max_chunk_bytes = 32768
max_buffered_bytes = 1048576
idle_timeout_seconds = 10.0
session_timeout_seconds = 60.0
# The accurate Zipformer is large; keep one recognizer warm and queue briefly.
max_concurrent_sessions = 1
max_queue_depth = 2
allowed_sample_rates = [16000, 44100, 48000, 96000]

# Local STT and TTS remain defaults. Text, STT, and TTS paid-call switches are
# independent. Unknown speech pricing fails closed until an administrator adds
# a reviewed positive price to the deployment config.
[providers]
stt_default = "local"
tts_default = "local"
allow_paid_stt = false
allow_paid_tts = false
cloud_stt_model = "gpt-4o-mini-transcribe"
cloud_tts_model = "gpt-4o-mini-tts"
cloud_tts_voice = "cedar"
cloud_tts_speed = 1.0
cloud_tts_instructions = "Warm, concise, calm home assistant."
# cloud_stt_price_per_minute_usd = <reviewed positive value>
# cloud_tts_price_per_million_characters_usd = <reviewed positive value>

# Optional semantic fallback. This connects only to a manually started local
# llama.cpp worker. Deterministic routing remains the default fast path.
[llm]
enabled = false
server_url = "http://127.0.0.1:18080"
model = "butters-router"
profile = "lfm2"
output_mode = "native_tools"
timeout_seconds = 12.0

# Local diagnostics are enabled and remain read-only. These bounds apply to one
# short-lived investigation and are independent of the voice session.
[diagnostics]
enabled = true
session_ttl_seconds = 900.0
max_evidence_bytes = 65536
max_log_bytes = 8192

# Cloud analysis is development-only and opt-in twice: enabled plus
# allow_paid_calls. OPENAI_API_KEY is read only from the process environment.
[cloud]
enabled = false
allow_paid_calls = false
provider = "openai"
base_url = "https://api.openai.com"
store_responses = false
luna_model = "gpt-5.6-luna"
terra_model = "gpt-5.6-terra"
sol_model = "gpt-5.6-sol"
allow_automatic_maximum = false
timeout_seconds = 45.0
max_tool_rounds = 4
max_total_tool_calls = 8
max_wall_seconds = 90.0
max_output_tokens = 1200
max_escalation_steps = 2
max_retries = 1
max_cloud_requests_per_diagnostic = 5
max_estimated_cost_per_request_usd = 0.50
daily_budget_usd = 2.0
monthly_budget_usd = 20.0
max_usage_records = 50000
# Provenance for the reviewed rates in butters/pricing.py. Both are updated
# in the same change as the rates themselves.
pricing_source = "https://developers.openai.com/api/docs/pricing"
pricing_date = "2026-09-19"

# Codex engineering jobs are rendered locally by default. Programmatic Codex
# execution and every production deployment operation remain disabled.
[remediation]
allow_codex_execution = false
timeout_seconds = 900.0
max_output_bytes = 131072
repository_root = "../.."
deployment_roots = ["/opt/home-sensor"]
jobs_dir = "/var/lib/butters/codex-jobs"
max_patch_bytes = 524288
max_generated_file_bytes = 262144
max_retained_jobs = 50
# Read-only repository inspection is opt-in per deployment. Leave empty unless a
# repository is deliberately readable by the butters service user; the skill then
# reports repository_unavailable instead of reaching into a private checkout.
project_inspection_root = ""

[[entities]]
id = "printer_room"
display_name = "Printer room"
sensor_type = "air_quality"
source_id = "office"
aliases = ["printer room", "printer area", "office", "sen66"]
groups = ["rooms", "air_quality_stations"]

[[entities]]
id = "x2d"
display_name = "Bambu Lab X2D"
sensor_type = "printer"
source_id = "x2d"
aliases = ["printer", "3d printer", "X2D", "Bambu", "Bambu printer"]
groups = ["printers"]

[[entities]]
id = "filament_box_1"
display_name = "Filament box one"
sensor_type = "environment"
source_id = "1"
aliases = ["filament box one", "filament box 1", "box one", "box 1", "container one", "container 1"]
groups = ["filament_boxes"]

[[entities]]
id = "filament_box_2"
display_name = "Filament box two"
sensor_type = "environment"
source_id = "2"
aliases = ["filament box two", "filament box 2", "box two", "box 2", "container two", "container 2"]
groups = ["filament_boxes"]

[[entities]]
id = "filament_box_3"
display_name = "Filament box three"
sensor_type = "environment"
source_id = "3"
aliases = ["filament box three", "filament box 3", "box three", "box 3", "container three", "container 3"]
groups = ["filament_boxes"]

# Server-owned NAS observation targets and the two fixed Jellyfin destinations.
# Nothing here is ever supplied, overridden, or influenced by a browser, the
# partner portal, or an action request: the status observer and the redirect
# read only this table.
[nas]
# Reserved/persistent LAN address of the one configured NAS.
lan_host = "192.168.1.240"
# TrueNAS middleware base URL, used for the OS/API reachability probe only.
api_url = "https://192.168.1.240"
api_port = 443
# MagicDNS name of the NAS's own Tailscale node.
tailscale_host = "truenas-scale.tail9644cc.ts.net"
tailscale_probe_port = 443
# The two, and only two, destinations the portal may ever redirect to.
jellyfin_lan_url = "http://192.168.1.240:8096"
jellyfin_tailscale_url = "http://truenas-scale.tail9644cc.ts.net:8096"
jellyfin_readiness_path = "/health"
probe_timeout_seconds = 2.0
total_probe_seconds = 6.0
cache_seconds = 2.0
# How long after a wake request the aggregate may still read WAKING.
wake_grace_seconds = 180.0

# Separate passkey-authenticated NAS/Jellyfin access surface. It shares this
# process and the one canonical control origin, but exposes only NAS status,
# Wake NAS, wake progress, and the server-chosen Jellyfin redirect.
[portal]
enabled = true
# Home networks whose clients may be sent to the LAN Jellyfin URL. Anything
# else, and anything that cannot be classified, fails safe to the Tailscale
# destination. See butters.web.locality for the exact trust boundary.
lan_networks = ["192.168.1.0/24"]
# Optional. Locality stated by a reviewed LOCAL ingress, honoured only when the
# request arrives from a trusted loopback peer. Empty disables it entirely.
locality_header = ""
# Optional bounded read of this host's own tailscaled, used to locate the
# calling identity's active peer. Local daemon state, never client input.
tailscale_status_command = ["/usr/bin/tailscale", "status", "--json"]
session_ttl_seconds = 900.0
wake_rate_per_minute = 3.0
wake_burst = 2
status_rate_per_minute = 120.0
status_burst = 30
# Overall bound on wake polling. A timeout never re-sends a magic packet.
max_poll_seconds = 300.0
invite_ttl_seconds = 1800.0
max_identities = 16
