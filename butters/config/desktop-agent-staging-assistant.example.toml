# Dedicated staging daemon. This listener is the loopback machine-ingress
# upstream and serves /agent/v1/session only. Local validation uses the fixed
# /run/butters-staging/validation.sock Unix socket instead.
[staging]
host = "127.0.0.1" # exact staging loopback machine-upstream identity
port = 18090        # not the private-LAN TLS port (18443)
state_dir = "/var/lib/butters-staging"

# Gate 1 of 2. Keep false in the repository template. Set true only in the
# root-owned local staging copy after credentials have been provisioned.
[agent_ingress]
enabled = false
config_path = "/etc/butters-staging/desktop-agent.toml"
protocol_version = 1
hello_timeout_seconds = 5.0
socket_idle_seconds = 60.0
heartbeat_aging_seconds = 30.0
heartbeat_stale_seconds = 45.0
request_timeout_seconds = 30

[actions]
audit_capacity = 1000
job_capacity = 256
