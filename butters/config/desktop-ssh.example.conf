# Install root:butters 0640 at /etc/butters/desktop-ssh/config.
# The private key is dedicated to this service and never stored in the repository.
Host desktop
    HostName DESKTOP-G4CFVL1.local
    User Daniel
    IdentityFile /etc/butters/desktop-ssh/id_ed25519
    UserKnownHostsFile /etc/butters/desktop-ssh/known_hosts
    HostKeyAlias 192.168.1.209
    IdentitiesOnly yes
    BatchMode yes
    StrictHostKeyChecking yes
    ServerAliveInterval 15
    ServerAliveCountMax 3
    ConnectTimeout 5
    ForwardAgent no
    ClearAllForwardings yes
