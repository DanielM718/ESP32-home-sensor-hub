# Install as root:root 0600 at /etc/butters/action-broker.toml only after review.
[broker]
service_user = "butters"

[desktop]
host = "192.168.1.209"
user = "Daniel"
mac = "34:5A:60:D7:4C:2C"
broadcast = "192.168.1.255"
# The broker pins the desktop host key to <key directory>/known_hosts and
# refuses to start when any SSH operation is enabled without it. Provision it as
# root:root 0600, for example:
#   ssh-keyscan -H <fixed desktop> > /etc/butters/action-broker/known_hosts
# after verifying the fingerprint out of band.
key = "/etc/butters/action-broker/windows_remote_mode"

[home_assistant]
# Authentication comes only from HOME_ASSISTANT_TOKEN in the root-controlled
# service environment. Monitor operations are compiled to two approved entities.
url = "http://127.0.0.1:8123"

[nas]
mac = ""
broadcast = ""

# Every privileged operation has a second, broker-local gate. Keep all values
# false until its fixed target, credential, and operation have been reviewed.
[operations]
"desktop.wake" = false
"desktop.monitors_off" = false
"desktop.monitors_on" = false
"desktop.parsec_status" = false
"desktop.parsec_ensure" = false
"desktop.parsec_restart" = false
"desktop.lock" = false
"desktop.sleep" = false
"desktop.restart" = false
"desktop.shutdown" = false
"host.restart_butters" = false
"host.reboot" = false
"host.shutdown" = false
"nas.wake" = false
"environment.heater_on" = false
"environment.heater_off" = false
"environment.dehumidifier_on" = false
"environment.dehumidifier_off" = false
"environment.ventilation_on" = false
"environment.ventilation_off" = false
